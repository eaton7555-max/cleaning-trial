name: Bootstrap cleaning-trial assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove bootstrap workflow and temporary icon encodings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f icon-192.png.b64 icon-512.png.b64 .github/workflows/bootstrap-trial.yml
          git commit -m "Remove one-shot bootstrap workflow and temporary icon encodings"
          git push
